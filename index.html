<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Home Inventory</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#0f172a">
<style>
:root{
  --bg:#0f172a; --card:#16213e; --card2:#1c2b4a; --text:#e8edf7; --muted:#8b96b3;
  --accent:#14b8a6; --accent2:#22d3ee; --danger:#f87171; --warn:#fbbf24; --good:#4ade80;
  --border:#28334f; --radius:14px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans Bengali",sans-serif;}
body{display:flex;flex-direction:column;min-height:100%;}
#app{flex:1;display:flex;flex-direction:column;max-width:640px;margin:0 auto;width:100%;}
header.topbar{position:sticky;top:0;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;background:rgba(15,23,42,.92);backdrop-filter:blur(6px);z-index:20;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);}
header.topbar h1{font-size:18px;margin:0;font-weight:700;}
header.topbar .lang-btn{background:var(--card2);border:1px solid var(--border);color:var(--text);border-radius:20px;padding:6px 12px;font-size:13px;}
main{flex:1;padding:14px 14px 90px;overflow-y:auto;}
.view{display:none;}
.view.active{display:block;animation:fade .15s ease;}
@keyframes fade{from{opacity:0}to{opacity:1}}
h2.section-title{font-size:15px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:18px 0 8px;}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:12px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:12px;}
.stat-card .label{font-size:12px;color:var(--muted);margin-bottom:4px;}
.stat-card .value{font-size:20px;font-weight:700;}
.stat-card .value.good{color:var(--good)}
.stat-card .value.danger{color:var(--danger)}
.quick-actions{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
.qa-btn{background:var(--card2);border:1px solid var(--border);border-radius:12px;padding:10px 4px;text-align:center;font-size:11px;color:var(--text);}
.qa-btn .ic{font-size:20px;display:block;margin-bottom:4px;}
button{cursor:pointer;font-family:inherit;}
.btn{background:var(--accent);border:none;color:#04211d;font-weight:700;border-radius:10px;padding:11px 16px;font-size:14px;width:100%;}
.btn.secondary{background:var(--card2);color:var(--text);border:1px solid var(--border);}
.btn.danger{background:var(--danger);color:#2a0a0a;}
.btn.small{width:auto;padding:8px 12px;font-size:13px;}
.row{display:flex;gap:8px;}
.row>*{flex:1;}
label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px;}
input,select,textarea{width:100%;background:var(--card2);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:10px 12px;font-size:15px;font-family:inherit;}
input[type=checkbox]{width:auto;}
textarea{min-height:70px;resize:vertical;}
.toggle-row{display:flex;align-items:center;justify-content:space-between;margin:12px 0 4px;}
.switch{position:relative;width:42px;height:24px;flex-shrink:0;}
.switch input{opacity:0;width:0;height:0;}
.slider{position:absolute;inset:0;background:var(--card2);border:1px solid var(--border);border-radius:24px;transition:.2s;}
.slider:before{content:"";position:absolute;width:18px;height:18px;left:2px;top:2px;background:var(--muted);border-radius:50%;transition:.2s;}
input:checked+.slider{background:var(--accent);}
input:checked+.slider:before{background:#04211d;transform:translateX(18px);}
.denom-row{display:grid;grid-template-columns:60px 1fr 90px;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--border);}
.denom-row:last-child{border-bottom:none;}
.denom-label{font-weight:700;}
.denom-total{text-align:right;color:var(--accent2);font-weight:600;}
.list-item{background:var(--card2);border:1px solid var(--border);border-radius:12px;padding:10px 12px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:10px;}
.list-item .meta{font-size:12px;color:var(--muted);}
.list-item .amt{font-weight:700;white-space:nowrap;}
.list-item .amt.income{color:var(--good)}
.list-item .amt.expense{color:var(--danger)}
.badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:20px;background:var(--card2);border:1px solid var(--border);color:var(--muted);}
.badge.low{background:#3a1a1a;color:var(--danger);border-color:#5a2a2a;}
.badge.open{background:#1a3a2f;color:var(--good);border-color:#2a5a45;}
.fab{position:fixed;bottom:calc(78px + env(safe-area-inset-bottom,0px));right:20px;background:var(--accent);color:#04211d;width:54px;height:54px;border-radius:50%;border:none;font-size:26px;box-shadow:0 4px 14px rgba(0,0,0,.4);z-index:15;}
nav.bottomnav{position:sticky;bottom:0;background:rgba(22,33,62,.96);backdrop-filter:blur(6px);border-top:1px solid var(--border);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:20;}
nav.bottomnav button{flex:1;background:none;border:none;color:var(--muted);font-size:10px;padding:8px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;}
nav.bottomnav button.active{color:var(--accent);}
nav.bottomnav .ic{font-size:18px;}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:none;align-items:flex-end;justify-content:center;}
.modal-bg.active{display:flex;}
.modal{background:var(--bg);border-top-left-radius:18px;border-top-right-radius:18px;border:1px solid var(--border);width:100%;max-width:640px;max-height:88vh;overflow-y:auto;padding:16px 16px calc(24px + env(safe-area-inset-bottom,0px));}
.modal h3{margin-top:0;}
.modal-close{position:sticky;top:0;text-align:right;}
.modal-close span{cursor:pointer;color:var(--muted);font-size:22px;}
.filter-tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px;padding-bottom:2px;}
.filter-tabs button{background:var(--card2);border:1px solid var(--border);color:var(--muted);border-radius:20px;padding:6px 14px;font-size:12px;white-space:nowrap;}
.filter-tabs button.active{background:var(--accent);color:#04211d;border-color:var(--accent);font-weight:700;}
.bar-row{margin-bottom:8px;}
.bar-row .bar-label{display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px;}
.bar-track{background:var(--card2);border-radius:6px;height:10px;overflow:hidden;}
.bar-fill{background:linear-gradient(90deg,var(--accent),var(--accent2));height:100%;}
.empty{text-align:center;color:var(--muted);padding:30px 10px;font-size:13px;}
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:var(--card2);border:1px solid var(--border);color:var(--text);padding:10px 18px;border-radius:20px;font-size:13px;z-index:60;opacity:0;transition:opacity .25s;pointer-events:none;}
.toast.show{opacity:1;}
.divider{border:none;border-top:1px solid var(--border);margin:14px 0;}
.discrepancy{font-size:18px;font-weight:800;text-align:center;padding:10px;border-radius:10px;margin:10px 0;}
.discrepancy.ok{background:#1a3a2f;color:var(--good);}
.discrepancy.bad{background:#3a1a1a;color:var(--danger);}
::-webkit-scrollbar{width:0;height:0;}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--bg:#0f172a;--text:#e8edf7;}}
</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <h1 id="appTitle">🏠 Home Inventory</h1>
    <button class="lang-btn" id="langToggle">EN / বাং</button>
  </header>
  <main id="main"></main>
  <button class="fab" id="fabAdd" title="Quick add">+</button>
  <nav class="bottomnav">
    <button data-view="dashboard" class="active"><span class="ic">🏠</span><span data-i18n="nav.dashboard">Dashboard</span></button>
    <button data-view="cash"><span class="ic">💵</span><span data-i18n="nav.cash">Cash</span></button>
    <button data-view="shopping"><span class="ic">🛒</span><span data-i18n="nav.shopping">Shopping</span></button>
    <button data-view="expenses"><span class="ic">🧾</span><span data-i18n="nav.expenses">Expenses</span></button>
    <button data-view="inventory"><span class="ic">📦</span><span data-i18n="nav.inventory">Inventory</span></button>
    <button data-view="reports"><span class="ic">📊</span><span data-i18n="nav.reports">Reports</span></button>
    <button data-view="transactions"><span class="ic">📋</span><span data-i18n="nav.txns">History</span></button>
    <button data-view="settings"><span class="ic">⚙️</span><span data-i18n="nav.settings">Settings</span></button>
  </nav>
</div>
<div class="modal-bg" id="modalBg"><div class="modal" id="modalBody"></div></div>
<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" onerror="window._xlsxFailed=true"></script>
<script>
/* ================= CONFIG / I18N ================= */
const CURRENCY_SYMBOL = "৳";
const fmt = (n) => CURRENCY_SYMBOL + Math.round(n||0).toLocaleString('en-IN');
const uid = () => 'id_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2,9);
const now = () => new Date().toISOString();
const todayStr = () => new Date().toISOString().slice(0,10);
const timeStr = () => new Date().toTimeString().slice(0,5);
let DEVICE_ID = localStorage.getItem('hi_device_id');
if(!DEVICE_ID){ DEVICE_ID = uid(); localStorage.setItem('hi_device_id', DEVICE_ID); }

const T = {
  en:{ "nav.dashboard":"Dashboard","nav.cash":"Cash","nav.shopping":"Shopping","nav.expenses":"Expenses",
    "nav.inventory":"Inventory","nav.reports":"Reports","nav.txns":"History","nav.settings":"Settings",
    balance:"Cash Balance", notesTotal:"Notes Total", coinsTotal:"Coins Total", todayExpense:"Today's Expense",
    openSessions:"Open Sessions", todayShopping:"Today's Shopping", todayTransport:"Today's Transport",
    recent:"Recent Transactions", addCash:"Add Cash", startShopping:"Start Shopping", addExpense:"Add Expense",
    addJourney:"Add Journey", addIncome:"Add Income", viewReports:"Reports", exportData:"Export", importData:"Import" },
  bn:{ "nav.dashboard":"ড্যাশবোর্ড","nav.cash":"নগদ","nav.shopping":"কেনাকাটা","nav.expenses":"খরচ",
    "nav.inventory":"মজুদ","nav.reports":"রিপোর্ট","nav.txns":"লেনদেন","nav.settings":"সেটিংস",
    balance:"নগদ ব্যালেন্স", notesTotal:"নোট মোট", coinsTotal:"কয়েন মোট", todayExpense:"আজকের খরচ",
    openSessions:"চলমান সেশন", todayShopping:"আজকের কেনাকাটা", todayTransport:"আজকের যাতায়াত",
    recent:"সাম্প্রতিক লেনদেন", addCash:"নগদ যোগ করুন", startShopping:"কেনাকাটা শুরু", addExpense:"খরচ যোগ",
    addJourney:"যাতায়াত যোগ", addIncome:"আয় যোগ", viewReports:"রিপোর্ট", exportData:"এক্সপোর্ট", importData:"ইমপোর্ট" }
};
let LANG = localStorage.getItem('hi_lang') || 'en';
function tr(key){ return (T[LANG] && T[LANG][key]) || (T.en[key]) || key; }
function applyI18n(){
  document.querySelectorAll('[data-i18n]').forEach(el=>{ el.textContent = tr(el.dataset.i18n); });
}
document.getElementById('langToggle').onclick = ()=>{ LANG = LANG==='en'?'bn':'en'; localStorage.setItem('hi_lang',LANG); applyI18n(); render(); };

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(()=>t.classList.remove('show'), 2200);
}

/* ================= DENOMINATIONS ================= */
const NOTES = [1000,500,200,100,50,20,10,5,2];
const COINS = [5,2,1];
const DEFAULT_CATEGORIES = [
  {en:"Grocery", bn:"মুদি"}, {en:"Food", bn:"খাবার"}, {en:"Transport", bn:"যাতায়াত"},
  {en:"Medicine", bn:"ওষুধ"}, {en:"Household", bn:"গৃহস্থালী"}, {en:"Utility", bn:"ইউটিলিটি"},
  {en:"Shopping", bn:"কেনাকাটা"}, {en:"Personal", bn:"ব্যক্তিগত"}, {en:"Entertainment", bn:"বিনোদন"}, {en:"Other", bn:"অন্যান্য"}
];

/* ================= INDEXEDDB LAYER ================= */
const DB_NAME = 'homeInventoryDB', DB_VERSION = 1;
const STORES = ["categories","cashSnapshots","currentCash","sessions","expenses","incomes","inventory","transactions","settings"];
let db;
function openDB(){
  return new Promise((resolve,reject)=>{
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = (e)=>{
      const d = e.target.result;
      STORES.forEach(s=>{ if(!d.objectStoreNames.contains(s)) d.createObjectStore(s,{keyPath:'id'}); });
    };
    req.onsuccess = (e)=>{ db = e.target.result; resolve(db); };
    req.onerror = (e)=>reject(e);
  });
}
function tx(store, mode='readonly'){ return db.transaction(store, mode).objectStore(store); }
function dbGetAll(store){ return new Promise((res,rej)=>{ const r = tx(store).getAll(); r.onsuccess=()=>res(r.result); r.onerror=rej; }); }
function dbGet(store,id){ return new Promise((res,rej)=>{ const r = tx(store).get(id); r.onsuccess=()=>res(r.result); r.onerror=rej; }); }
function dbPut(store,obj){ return new Promise((res,rej)=>{ if(!obj.id) obj.id=uid(); obj.updatedAt=now(); if(!obj.createdAt) obj.createdAt=now(); obj.deviceId=DEVICE_ID; const r = tx(store,'readwrite').put(obj); r.onsuccess=()=>res(obj); r.onerror=rej; }); }
function dbDelete(store,id){ return new Promise((res,rej)=>{ const r = tx(store,'readwrite').delete(id); r.onsuccess=()=>res(); r.onerror=rej; }); }
function dbClear(store){ return new Promise((res,rej)=>{ const r = tx(store,'readwrite').clear(); r.onsuccess=()=>res(); r.onerror=rej; }); }

async function addTransaction(type, amount, category, description, sessionId=null){
  await dbPut('transactions',{ id:uid(), type, amount:Math.round(amount), category:category||'Other',
    date: todayStr(), time: timeStr(), sessionId, description: description||'', createdAt:now(), updatedAt:now() });
}

/* ================= STATE / INIT ================= */
let STATE = { view:'dashboard', advCash:false, advShopping:false, categories:[], currentCash:null };

async function seedIfEmpty(){
  const cats = await dbGetAll('categories');
  if(cats.length===0){
    for(const c of DEFAULT_CATEGORIES) await dbPut('categories',{id:uid(),nameEn:c.en,nameBn:c.bn,parentId:null,active:true});
  }
  const cc = await dbGet('currentCash','current');
  if(!cc){
    const denoms = {}; [...NOTES,...COINS].forEach(d=>denoms[d]=0);
    await dbPut('currentCash',{id:'current', denoms, advanced:false, notesMeta:{}});
  }
  const s = await dbGet('settings','app');
  if(!s) await dbPut('settings',{id:'app', lang:'en', lastBackup:null});
}

async function getCurrentCash(){ return await dbGet('currentCash','current'); }
function cashTotals(cc){
  let notesTotal=0, coinsTotal=0;
  NOTES.forEach(d=>{ notesTotal += d * (cc.denoms[d]||0); });
  COINS.forEach(d=>{ coinsTotal += d * (cc.denoms[d]||0); });
  return { notesTotal, coinsTotal, grand: notesTotal+coinsTotal };
}

/* ================= CATEGORY HIERARCHY HELPERS ================= */
let CAT_CACHE = [];
async function loadCatCache(){ CAT_CACHE = await dbGetAll('categories'); return CAT_CACHE; }
function catById(id, cats=CAT_CACHE){ return cats.find(c=>c.id===id) || null; }
function catDisplayName(cat){ if(!cat) return ''; return LANG==='bn' ? (cat.nameBn || cat.nameEn) : (cat.nameEn || cat.nameBn); }
function catBreadcrumb(id, cats=CAT_CACHE, sep=' › '){
  const path = []; let cur = catById(id, cats); let guard=0;
  while(cur && guard++<10){ path.unshift(catDisplayName(cur)); cur = cur.parentId ? catById(cur.parentId, cats) : null; }
  return path.join(sep);
}
function normName(s){ return (s||'').trim().toLowerCase(); }
function findCategoryDuplicate(nameEn, nameBn, cats=CAT_CACHE, excludeId=null){
  const en = normName(nameEn), bn = normName(nameBn);
  if(!en && !bn) return null;
  return cats.find(c=>{
    if(c.id===excludeId) return false;
    const cEn = normName(c.nameEn), cBn = normName(c.nameBn);
    return (en && (cEn===en || cBn===en)) || (bn && (cEn===bn || cBn===bn));
  }) || null;
}
function childrenOf(parentId, cats=CAT_CACHE){ return cats.filter(c=> (c.parentId||null) === (parentId||null)); }
function flattenCategoryTree(cats=CAT_CACHE){
  // returns [{cat, depth, breadcrumb}] in display order (roots then children, depth-first)
  const out = [];
  function walk(parentId, depth){
    childrenOf(parentId, cats).sort((a,b)=> catDisplayName(a).localeCompare(catDisplayName(b))).forEach(c=>{
      out.push({ cat:c, depth, breadcrumb: catBreadcrumb(c.id, cats) });
      walk(c.id, depth+1);
    });
  }
  walk(null, 0);
  return out;
}
function categorySelectOptions(cats, selectedId, includeBlank){
  const flat = flattenCategoryTree(cats).filter(f=>f.cat.active);
  let html = includeBlank ? `<option value="">— Select category —</option>` : '';
  html += flat.map(f=>`<option value="${f.cat.id}" ${f.cat.id===selectedId?'selected':''}>${'— '.repeat(f.depth)}${catDisplayName(f.cat)}</option>`).join('');
  return html;
}

/* ================= ROUTER ================= */
const views = {};
function setView(v){
  STATE.view = v;
  document.querySelectorAll('nav.bottomnav button').forEach(b=>b.classList.toggle('active', b.dataset.view===v));
  render();
}
document.querySelectorAll('nav.bottomnav button').forEach(b=> b.onclick=()=>setView(b.dataset.view));
document.getElementById('fabAdd').onclick = ()=>openQuickAddMenu();

function openModal(html){
  document.getElementById('modalBody').innerHTML = '<div class="modal-close"><span onclick="closeModal()">✕</span></div>' + html;
  document.getElementById('modalBg').classList.add('active');
  applyI18n();
}
function closeModal(){ document.getElementById('modalBg').classList.remove('active'); }
document.getElementById('modalBg').onclick = (e)=>{ if(e.target.id==='modalBg') closeModal(); };

function openQuickAddMenu(){
  openModal(`<h3>Quick Add</h3>
  <button class="btn secondary" style="margin-bottom:8px" onclick="closeModal();setView('cash')">💵 ${tr('addCash')}</button>
  <button class="btn secondary" style="margin-bottom:8px" onclick="closeModal();openStartSession()">🛒 ${tr('startShopping')}</button>
  <button class="btn secondary" style="margin-bottom:8px" onclick="closeModal();openExpenseForm()">🧾 ${tr('addExpense')}</button>
  <button class="btn secondary" style="margin-bottom:8px" onclick="closeModal();openIncomeForm()">➕ ${tr('addIncome')}</button>`);
}

async function render(){
  await loadCatCache();
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  const main = document.getElementById('main');
  main.innerHTML = '<div class="view active" id="viewRoot"></div>';
  const root = document.getElementById('viewRoot');
  if(STATE.view==='dashboard') await renderDashboard(root);
  else if(STATE.view==='cash') await renderCash(root);
  else if(STATE.view==='shopping') await renderShopping(root);
  else if(STATE.view==='expenses') await renderExpenses(root);
  else if(STATE.view==='inventory') await renderInventory(root);
  else if(STATE.view==='reports') await renderReports(root);
  else if(STATE.view==='transactions') await renderTransactions(root);
  else if(STATE.view==='settings') await renderSettings(root);
  applyI18n();
}

/* ================= DASHBOARD ================= */
async function renderDashboard(root){
  const cc = await getCurrentCash();
  const {notesTotal, coinsTotal, grand} = cashTotals(cc);
  const txns = await dbGetAll('transactions');
  const today = todayStr();
  const todayTxns = txns.filter(t=>t.date===today);
  const todayExpense = todayTxns.filter(t=>['Expense','Shopping','Transport'].includes(t.type)).reduce((a,b)=>a+b.amount,0);
  const todayShopping = todayTxns.filter(t=>t.type==='Shopping').reduce((a,b)=>a+b.amount,0);
  const todayTransport = todayTxns.filter(t=>t.type==='Transport').reduce((a,b)=>a+b.amount,0);
  const sessions = await dbGetAll('sessions');
  const openSessions = sessions.filter(s=>s.status==='open').length;
  const recent = txns.sort((a,b)=> (b.date+b.time).localeCompare(a.date+a.time)).slice(0,6);

  root.innerHTML = `
  <div class="grid2">
    <div class="stat-card"><div class="label">${tr('balance')}</div><div class="value good">${fmt(grand)}</div></div>
    <div class="stat-card"><div class="label">${tr('todayExpense')}</div><div class="value danger">${fmt(todayExpense)}</div></div>
    <div class="stat-card"><div class="label">${tr('notesTotal')}</div><div class="value">${fmt(notesTotal)}</div></div>
    <div class="stat-card"><div class="label">${tr('coinsTotal')}</div><div class="value">${fmt(coinsTotal)}</div></div>
    <div class="stat-card"><div class="label">${tr('openSessions')}</div><div class="value">${openSessions}</div></div>
    <div class="stat-card"><div class="label">${tr('todayShopping')}</div><div class="value">${fmt(todayShopping)}</div></div>
    <div class="stat-card"><div class="label">${tr('todayTransport')}</div><div class="value">${fmt(todayTransport)}</div></div>

function renderDenomRows(cc){
  const notesEl = document.getElementById('notesRows');
  const coinsEl = document.getElementById('coinsRows');
  notesEl.innerHTML = NOTES.map(d=>denomRowHtml(d,cc,true)).join('');

function denomRowHtml(d,cc,isNote){
  const qty = cc.denoms[d]||0;

    const meta = cc.notesMeta[d] || {condition:'General', torn:false};
    advHtml = `<div class="row" style="margin-top:6px">
      <select onchange="setNoteMeta(${d},'condition',this.value)">
        ${['New','Medium Old','Old','General'].map(c=>`<option value="${c}" ${meta.condition===c?'selected':''}>${c}</option>`).join('')}

  }
  return `<div class="denom-row"><div class="denom-label">${CURRENCY_SYMBOL}${d}</div>
    <input type="number" min="0" id="qty_${d}" value="${qty}">
    <div class="denom-total" id="tot_${d}">${fmt(d*qty)}</div></div>${advHtml}`;

async function setNoteMeta(d,key,val){

function sessionItemsTotal(s){ return (s.items||[]).reduce((a,i)=>a+i.total,0); }
function sessionJourneysTotal(s){ return (s.journeys||[]).reduce((a,j)=>a+j.cost,0); }
function sessionTotal(s){ return sessionItemsTotal(s) + sessionJourneysTotal(s); }

async function renderShopping(root){

    const total = sessionTotal(s);
    return `<div class="list-item" onclick="openSessionDetail('${s.id}')" style="cursor:pointer">
      <div><div>${s.name} <span class="badge ${s.status==='open'?'open':''}">${s.status}</span></div>
      <div class="meta">${s.date} · cash taken ${fmt(s.cashTaken)} · ${(s.items||[]).length} items</div></div>
      <div class="amt expense">${fmt(total)}</div></div>`;
  }).join('') : '<div class="empty">No shopping sessions yet.</div>'}`;
}

function openStartSession(){

async function createSession(){

    bill:{total:0,paid:0,change:0}, endCash:null, createdAt:now() };

async function openSessionDetail(id){

  const itemsTotal = sessionItemsTotal(s), journeysTotal = sessionJourneysTotal(s), total = itemsTotal+journeysTotal;
  openModal(`<h3>${s.name} <span class="badge ${s.status==='open'?'open':''}">${s.status}</span></h3>
  <div class="meta">${s.date} ${s.startTime} · Cash taken: ${fmt(s.cashTaken)}</div>

  <div id="advShopBlock"></div>

  <h4 style="margin-bottom:6px">Items (${(s.items||[]).length}) — ${fmt(itemsTotal)}</h4>
  ${(s.items||[]).map((it,idx)=>`<div class="list-item"><div><div>${it.name}${it.qty>1?(' × '+it.qty):''}</div><div class="meta">${it.category||''} ${it.unit?('· '+it.unit):''}</div></div><div class="amt expense">${fmt(it.total)} <span onclick="removeSessionItem('${s.id}',${idx})" style="cursor:pointer;color:var(--danger)">✕</span></div></div>`).join('') || '<div class="empty">No items yet.</div>'}
  <h4 style="margin:14px 0 6px">Journeys — ${fmt(journeysTotal)}</h4>
  ${(s.journeys||[]).map((j,idx)=>`<div class="list-item"><div><div>${j.type}</div><div class="meta">${j.from||''}${j.to?(' → '+j.to):''}</div></div><div class="amt expense">${fmt(j.cost)} <span onclick="removeSessionJourney('${s.id}',${idx})" style="cursor:pointer;color:var(--danger)">✕</span></div></div>`).join('') || '<div class="empty">No journeys yet.</div>'}
  <div class="row" style="margin-top:8px">
    <select id="journeyType"><option>Rickshaw</option><option>CNG</option><option>Bus</option><option>Walking</option><option>Other</option></select>

   : `<div class="discrepancy ${Math.abs(s.difference||0)<=0? 'ok':'bad'}">Reconciled — Difference: ${fmt(s.difference||0)}</div>`}
  <button class="btn danger" style="margin-top:10px" onclick="deleteSession('${s.id}')">Delete Session</button>
  `);
  document.getElementById('advSesToggle').onchange = async (e)=>{ const s2=await dbGet('sessions',id); s2.advanced=e.target.checked; await dbPut('sessions',s2); openSessionDetail(id); };

}
function renderAdvShopBlock(s){
  const el = document.getElementById('advShopBlock');
  if(!s.advanced){ el.innerHTML=''; return; }
  el.innerHTML = `<label>Shop Name</label><input id="shopName" value="${s.shop.name||''}">

  <button class="btn secondary" style="margin-top:8px" onclick="saveShopBill('${s.id}')">Save Shop / Bill Info</button>`;

async function saveShopBill(id){
  const s = await dbGet('sessions',id);
  s.shop = { name:document.getElementById('shopName').value, phone:document.getElementById('shopPhone').value, address:document.getElementById('shopAddr').value };
  const total = parseInt(document.getElementById('billTotal').value)||0;
  const paid = parseInt(document.getElementById('billPaid').value)||0;
  s.bill = { total, paid, change: Math.max(0,paid-total) };
  await dbPut('sessions',s); toast('Saved'); openSessionDetail(id);
}
function parseQuickItems(text){
  return text.split('\n').map(l=>l.trim()).filter(Boolean).map(line=>{
    let m = line.match(/^(.+?)[,\-–]\s*৳?\s*([\d.]+)\s*$/);
    if(!m) m = line.match(/^(.+?)\s+৳?\s*([\d.]+)\s*$/);
    if(!m) return null;
    return { name:m[1].trim(), price: parseFloat(m[2]) };
  }).filter(Boolean);
}
async function quickAddItems(id){
  const text = document.getElementById('quickItems').value;
  const parsed = parseQuickItems(text);
  if(!parsed.length){ toast('No valid items found — use "Item, Price" per line'); return; }
  const s = await dbGet('sessions', id);
  s.items = s.items || [];
  parsed.forEach(p=> s.items.push({ id:uid(), name:p.name, category:'', brand:'', unit:'', qty:1, priceUnit:p.price, total: Math.round(p.price), note:'', addToInventory:false }));
  await dbPut('sessions', s);
  toast(parsed.length+' item(s) added'); openSessionDetail(id);
}
async function removeSessionItem(id, idx){ const s = await dbGet('sessions',id); s.items.splice(idx,1); await dbPut('sessions',s); openSessionDetail(id); }
async function removeSessionJourney(id, idx){ const s = await dbGet('sessions',id); s.journeys.splice(idx,1); await dbPut('sessions',s); openSessionDetail(id); }
async function addJourney(id){
  const type = document.getElementById('journeyType').value;
  const cost = Math.max(0, parseInt(document.getElementById('journeyCost').value)||0);
  const s = await dbGet('sessions', id);
  s.journeys = s.journeys || [];
  s.journeys.push({ id:uid(), type, cost, from:'', to:'' });
  await dbPut('sessions', s);
  toast('Journey added'); openSessionDetail(id);
}
async function deleteSession(id){
  if(!confirm('Delete this shopping session? This cannot be undone.')) return;
  await dbDelete('sessions', id); closeModal(); toast('Session deleted'); render();
}
async function openEndSession(id){
  const s = await dbGet('sessions', id);
  const total = sessionTotal(s);
  const expected = Math.max(0, s.cashTaken - total);
  openModal(`<h3>End Session — ${s.name}</h3>
  <div class="card"><div>Starting cash: ${fmt(s.cashTaken)}</div><div>Total expense: ${fmt(total)}</div><div><b>Expected remaining: ${fmt(expected)}</b></div></div>
  <label>Actual Remaining Cash (${CURRENCY_SYMBOL})</label><input type="number" min="0" id="actualCash" placeholder="${expected}">
  <button class="btn" style="margin-top:12px" onclick="confirmEndSession('${s.id}', ${expected})">Reconcile & Close</button>`);
}
async function confirmEndSession(id, expected){
  const actual = parseInt(document.getElementById('actualCash').value);
  if(isNaN(actual)){ toast('Enter actual cash'); return; }
  const s = await dbGet('sessions', id);
  const total = sessionTotal(s);
  s.status='closed'; s.endCash=actual; s.expectedCash=expected; s.difference = actual-expected;
  await dbPut('sessions', s);
  const itemsTotal = sessionItemsTotal(s), journeysTotal = sessionJourneysTotal(s);
  if(itemsTotal>0) await addTransaction('Shopping', itemsTotal, 'Shopping', s.name, s.id);
  if(journeysTotal>0) await addTransaction('Transport', journeysTotal, 'Transport', s.name+' (transport)', s.id);
  // inventory update for items marked
  for(const it of (s.items||[])){
    if(it.addToInventory){
      const inv = (await dbGetAll('inventory')).find(i=>i.name.toLowerCase()===it.name.toLowerCase());
      if(inv){ inv.currentQty = (inv.currentQty||0) + (it.qty||1); inv.lastPurchasePrice=it.priceUnit; inv.lastPurchaseDate=todayStr(); await dbPut('inventory',inv); }
      else { await dbPut('inventory',{ id:uid(), name:it.name, category:it.category||'Other', unit:it.unit||'', currentQty:it.qty||1, minQty:1, brand:it.brand||'', lastPurchasePrice:it.priceUnit, lastPurchaseDate:todayStr(), notes:'' }); }
    }
  }
  closeModal(); toast('Session reconciled'); render();
}

async function renderReports(root){
  const txns = await dbGetAll('transactions');
  const sessions = await dbGetAll('sessions');
  const today = todayStr();
  const month = today.slice(0,7);
  const todayT = txns.filter(t=>t.date===today);
  const monthT = txns.filter(t=>t.date.startsWith(month));
  const sum = (arr,types)=> arr.filter(t=>types.includes(t.type)).reduce((a,b)=>a+b.amount,0);

  const dIncome = sum(todayT,['Income']), dExpense = sum(todayT,['Expense','Shopping','Transport']);
  const dShopping = sum(todayT,['Shopping']), dTransport = sum(todayT,['Transport']), dOther = sum(todayT,['Expense']);
  const cc = await getCurrentCash(); const {grand} = cashTotals(cc);

  const mIncome = sum(monthT,['Income']), mExpense = sum(monthT,['Expense','Shopping','Transport']);
  const byCat = {};
  monthT.filter(t=>t.type!=='Income'&&t.type!=='Cash Snapshot').forEach(t=>{ byCat[t.category]=(byCat[t.category]||0)+t.amount; });
  const maxCat = Math.max(1,...Object.values(byCat));

  const closedSessions = sessions.filter(s=>s.status==='closed');
  const totalSessionAmt = closedSessions.reduce((a,s)=>a+sessionTotal(s),0);
  const avgSession = closedSessions.length? Math.round(totalSessionAmt/closedSessions.length):0;
  const itemCounts = {};
  sessions.forEach(s=>(s.items||[]).forEach(it=>{ itemCounts[it.name]=(itemCounts[it.name]||0)+1; }));
  const topItems = Object.entries(itemCounts).sort((a,b)=>b[1]-a[1]).slice(0,5);

  root.innerHTML = `
  <h2 class="section-title">Daily (${today})</h2>
  <div class="card"><div>Income: ${fmt(dIncome)}</div><div>Total Expense: ${fmt(dExpense)}</div><div>Shopping: ${fmt(dShopping)}</div><div>Transport: ${fmt(dTransport)}</div><div>Closing Cash: ${fmt(grand)}</div></div>

  <h2 class="section-title">Monthly (${month})</h2>
  <div class="card"><div>Total Income: ${fmt(mIncome)}</div><div>Total Expense: ${fmt(mExpense)}</div></div>
  <div class="card">
    ${Object.entries(byCat).length? Object.entries(byCat).sort((a,b)=>b[1]-a[1]).map(([cat,amt])=>`
    <div class="bar-row"><div class="bar-label"><span>${cat}</span><span>${fmt(amt)}</span></div><div class="bar-track"><div class="bar-fill" style="width:${(amt/maxCat*100)}%"></div></div></div>`).join('') : '<div class="empty">No category data this month.</div>'}
  </div>

  <h2 class="section-title">Shopping</h2>
  <div class="card"><div>Sessions: ${closedSessions.length}</div><div>Total Shopping Amount: ${fmt(totalSessionAmt)}</div><div>Average per Session: ${fmt(avgSession)}</div>
  ${topItems.length?('<div style="margin-top:8px">Most Purchased: '+topItems.map(t=>t[0]+' ×'+t[1]).join(', ')+'</div>'):''}</div>

  <h2 class="section-title">Cash</h2>
  <div class="card"><div>Cash Added (month): ${fmt(mIncome)}</div><div>Expenses (month): ${fmt(mExpense)}</div><div>Physical Closing Cash: ${fmt(grand)}</div></div>
  `;
}

let TXN_FILTER='All', TXN_SEARCH='', TXN_SORT='date_desc';
async function renderTransactions(root){
  let txns = await dbGetAll('transactions');

  if(TXN_SEARCH) txns = txns.filter(t=> (t.description+t.category).toLowerCase().includes(TXN_SEARCH.toLowerCase()));
  txns.sort((a,b)=>{
    const key = a.date+a.time, key2 = b.date+b.time;
    if(TXN_SORT==='date_desc') return key2.localeCompare(key);
    if(TXN_SORT==='date_asc') return key.localeCompare(key2);

    if(TXN_SORT==='amt_asc') return a.amount-b.amount;

  });

/* Merge a batch of category-shaped rows against the in-memory + persisted category tree */
async function mergeCategoryRows(rows){
  let cats = await dbGetAll('categories');
  let newC=0, updated=0, skipped=0;
  for(const row of rows){
    const nameEn = (row.nameEn||row.name||'').toString().trim();
    const nameBn = (row.nameBn||'').toString().trim();
    if(!nameEn && !nameBn){ skipped++; continue; }
    const existingById = row.id ? cats.find(c=>c.id===row.id) : null;
    const dup = findCategoryDuplicate(nameEn, nameBn, cats, existingById?.id||null);
    if(dup){ skipped++; continue; } // already exists somewhere in the hierarchy — never duplicate
    if(existingById){
      const inTime = row.updatedAt||''; const exTime = existingById.updatedAt||'';
      if(inTime > exTime){ existingById.nameEn=nameEn; existingById.nameBn=nameBn; existingById.parentId=row.parentId||null; existingById.active = row.active!==false && row.active!=='FALSE'; await dbPut('categories', existingById); updated++; }
      else skipped++;
    } else {
      const rec = { id: row.id || uid(), nameEn, nameBn, parentId: row.parentId||null, active: row.active!==false && row.active!=='FALSE' };
      await dbPut('categories', rec); cats.push(rec); newC++;
    }
  }
  await loadCatCache();
  return {newC, updated, skipped};
}
async function mergeExpenseRows(rows){
  let newC=0, updated=0, skipped=0;
  for(const row of rows){
    if(!row.id || !row.name){ skipped++; continue; }
    const existing = await dbGet('expenses', row.id);
    const rec = { id:row.id, name:row.name, amount: parseInt(row.amount)||0, categoryId: row.categoryId||'', category: row.category||'Other',
      date: row.date||todayStr(), time: row.time||'00:00', vendor: row.vendor||'', paymentMethod: row.paymentMethod||'Cash', note: row.note||'' };
    if(!existing){ await dbPut('expenses', rec); await addTransaction('Expense', rec.amount, rec.category, rec.name); newC++; }
    else{
      const inTime = row.updatedAt||''; const exTime = existing.updatedAt||'';
      if(inTime > exTime){ await dbPut('expenses', Object.assign(existing, rec)); updated++; } else skipped++;
    }
  }
  return {newC, updated, skipped};
}
async function mergeSessionRows(sesRows, itemRows=[], journeyRows=[]){
  let newC=0, updated=0, skipped=0;
  const itemsBySession = {}, journeysBySession = {};
  itemRows.forEach(r=>{ (itemsBySession[r.sessionId] = itemsBySession[r.sessionId]||[]).push({ id:r.id||uid(), name:r.name, category:r.category||'', brand:r.brand||'', unit:r.unit||'', qty:parseFloat(r.qty)||1, priceUnit:parseFloat(r.priceUnit)||0, total:parseFloat(r.total)||0, note:r.note||'', addToInventory: r.addToInventory===true||r.addToInventory==='TRUE' }); });
  journeyRows.forEach(r=>{ (journeysBySession[r.sessionId] = journeysBySession[r.sessionId]||[]).push({ id:r.id||uid(), type:r.type, cost:parseFloat(r.cost)||0, from:r.from||'', to:r.to||'' }); });
  for(const row of sesRows){
    if(!row.id || !row.name){ skipped++; continue; }
    const existing = await dbGet('sessions', row.id);
    const rec = { id:row.id, name:row.name, date:row.date||todayStr(), startTime:row.startTime||'00:00', cashTaken: parseInt(row.cashTaken)||0,
      status: row.status||'closed', advanced: row.advanced===true||row.advanced==='TRUE',
      items: itemsBySession[row.id] || (existing?existing.items:[]) || [],
      journeys: journeysBySession[row.id] || (existing?existing.journeys:[]) || [],
      shop: { name:row.shopName||'', phone:row.shopPhone||'', address:row.shopAddress||'' },
      bill: { total: parseInt(row.billTotal)||0, paid: parseInt(row.billPaid)||0, change: parseInt(row.billChange)||0 },
      endCash: row.endCash===''?null:parseInt(row.endCash), expectedCash: row.expectedCash===''?null:parseInt(row.expectedCash), difference: row.difference===''?null:parseInt(row.difference) };
    if(!existing){
      await dbPut('sessions', rec);
      const it = (rec.items||[]).reduce((a,i)=>a+i.total,0), jr = (rec.journeys||[]).reduce((a,j)=>a+j.cost,0);
      if(it>0) await addTransaction('Shopping', it, 'Shopping', rec.name, rec.id);
      if(jr>0) await addTransaction('Transport', jr, 'Transport', rec.name+' (transport)', rec.id);
      newC++;
    } else {
      const inTime = row.updatedAt||''; const exTime = existing.updatedAt||'';
      if(inTime > exTime){ await dbPut('sessions', Object.assign(existing, rec)); updated++; } else skipped++;
    }
  }
  return {newC, updated, skipped};
}
function sumSummaries(list){ return list.reduce((a,b)=>({newC:a.newC+b.newC, updated:a.updated+b.updated, skipped:a.skipped+b.skipped}), {newC:0,updated:0,skipped:0}); }
function showMergeSummary(title, s){
  closeModal();
  openModal(`<h3>${title}</h3><div class="card">
    <div>New: ${s.newC}</div><div>Updated: ${s.updated}</div><div>Skipped (duplicate or older): ${s.skipped}</div>
    <button class="btn" style="margin-top:12px" onclick="closeModal();render()">Done</button></div>`);
}
async function importExcelFile(file){
  if(!xlsxReady()){ toast('Excel needs internet the first time to load the library'); return; }
  const buf = await file.arrayBuffer();
  const wb = XLSX.read(buf, {type:'array'});
  const sheet = (name)=> wb.Sheets[name] ? XLSX.utils.sheet_to_json(wb.Sheets[name], {defval:''}) : [];
  const catSummary = await mergeCategoryRows(sheet('Categories'));
  const expSummary = await mergeExpenseRows(sheet('Expenses'));
  const sesSummary = await mergeSessionRows(sheet('Sessions'), sheet('SessionItems'), sheet('SessionJourneys'));
  showMergeSummary('Excel Import — Merge Summary', sumSummaries([catSummary, expSummary, sesSummary]));
}

/* ---- Multi-file CSV export/import (Categories, Expenses, Sessions) ---- */
async function exportCSVAll(){
  const categories = await dbGetAll('categories'); await loadCatCache();
  const expenses = await dbGetAll('expenses');
  const sessions = await dbGetAll('sessions');
  const catCsv = toCSV(categories.map(c=>({id:c.id,nameEn:c.nameEn||'',nameBn:c.nameBn||'',parentId:c.parentId||'',breadcrumb:catBreadcrumb(c.id,categories),active:c.active,updatedAt:c.updatedAt||''})));
  const expCsv = toCSV(expenses.map(e=>({id:e.id,name:e.name,amount:e.amount,categoryId:e.categoryId||'',category:e.category||'',date:e.date,time:e.time,vendor:e.vendor||'',paymentMethod:e.paymentMethod||'',note:e.note||'',updatedAt:e.updatedAt||''})));
  const sesCsv = toCSV(sessions.map(s=>({id:s.id,name:s.name,date:s.date,startTime:s.startTime,cashTaken:s.cashTaken,status:s.status,advanced:!!s.advanced,shopName:s.shop?.name||'',shopPhone:s.shop?.phone||'',shopAddress:s.shop?.address||'',billTotal:s.bill?.total||0,billPaid:s.bill?.paid||0,billChange:s.bill?.change||0,endCash:s.endCash??'',expectedCash:s.expectedCash??'',difference:s.difference??'',updatedAt:s.updatedAt||''})));
  downloadFile(`home-inventory-categories-${todayStr()}.csv`, catCsv, 'text/csv');
  setTimeout(()=>downloadFile(`home-inventory-expenses-${todayStr()}.csv`, expCsv, 'text/csv'), 300);
  setTimeout(()=>downloadFile(`home-inventory-sessions-${todayStr()}.csv`, sesCsv, 'text/csv'), 600);
  toast('CSV files exported (Categories, Expenses, Sessions)');
}
function toCSV(rows){
  if(!rows.length) return '';
  const header = Object.keys(rows[0]);
  return [header.join(',')].concat(rows.map(r=>header.map(h=>csvEscape(r[h])).join(','))).join('\n');
}
function parseCSVText(text){
  const lines = text.replace(/\r\n/g,'\n').split('\n').filter(l=>l.length);
  if(!lines.length) return [];
  const parseLine = (line)=>{
    const out=[]; let cur=''; let inQ=false;
    for(let i=0;i<line.length;i++){ const ch=line[i];
      if(inQ){ if(ch==='"'){ if(line[i+1]==='"'){cur+='"';i++;} else inQ=false; } else cur+=ch; }
      else { if(ch==='"') inQ=true; else if(ch===','){ out.push(cur); cur=''; } else cur+=ch; }
    }
    out.push(cur); return out;
  };
  const header = parseLine(lines[0]);
  return lines.slice(1).map(l=>{ const vals=parseLine(l); const o={}; header.forEach((h,i)=>o[h]=vals[i]!==undefined?vals[i]:''); return o; });
}
async function importCSVFile(file){
  const text = await file.text();
  const rows = parseCSVText(text);
  if(!rows.length){ toast('CSV file has no data rows'); return; }
  const headers = Object.keys(rows[0]);
  if(headers.includes('nameEn') || headers.includes('breadcrumb')){
    const s = await mergeCategoryRows(rows); showMergeSummary('CSV Import — Categories', s);
  } else if(headers.includes('vendor') || headers.includes('paymentMethod') || (headers.includes('amount') && headers.includes('name'))){
    const s = await mergeExpenseRows(rows); showMergeSummary('CSV Import — Expenses', s);
  } else if(headers.includes('cashTaken')){
    const s = await mergeSessionRows(rows, [], []); showMergeSummary('CSV Import — Sessions (note: item/journey detail is not carried in CSV — use Excel or JSON for full session detail)', s);
  } else {
    toast('Could not detect CSV type — expected a Categories, Expenses or Sessions export');
  }
}

async function backupNow(){
  await exportJSON();

}
async function resetAllData(){
  if(!confirm('This will permanently delete ALL data on this device. Continue?')) return;
  if(!confirm('Are you absolutely sure? This cannot be undone.')) return;
  for(const s of STORES) await dbClear(s);
  await seedIfEmpty(); toast('All data reset'); render();
}

/* ---- Import / Merge ---- */
function validateImportShape(data){
  if(typeof data!=='object'||!data) return false;
  if(!('schemaVersion' in data)) return false;
  return STORES.some(s=>Array.isArray(data[s]));
}
async function doImport(){
  const file = document.getElementById('importFile').files[0];
  if(!file){ toast('Choose a file first (.json, .xlsx or .csv)'); return; }
  const ext = file.name.split('.').pop().toLowerCase();
  if(ext==='xlsx' || ext==='xls'){ await importExcelFile(file); return; }
  if(ext==='csv'){ await importCSVFile(file); return; }
  await importJSONFile(file);
}
async function importJSONFile(file){
  const replace = document.getElementById('importReplace').checked;
  const text = await file.text();
  let data;
  try{ data = JSON.parse(text); }catch(e){ toast('Invalid JSON file'); return; }
  if(!validateImportShape(data)){ toast('File does not look like a Home Inventory export'); return; }
  if(replace && !confirm('Replace ALL local data with this import? This cannot be undone.')) return;

  let imported=0,newC=0,updated=0,skipped=0,conflicts=0;
  for(const storeName of STORES){
    if(!Array.isArray(data[storeName])) continue;
    if(replace) await dbClear(storeName);
    for(const rec of data[storeName]){
      if(!rec || !rec.id){ skipped++; continue; }
      imported++;
      if(replace){ await dbPut(storeName, rec); newC++; continue; }
      const existing = await dbGet(storeName, rec.id);
      if(!existing){ await dbPut(storeName, rec); newC++; }
      else{
        const exTime = existing.updatedAt || existing.createdAt || '';
        const inTime = rec.updatedAt || rec.createdAt || '';
        if(inTime > exTime){ await dbPut(storeName, rec); updated++; }
        else{ skipped++; }
      }
    }
  }
  toast('Import complete'); closeModal();
  openModal(`<h3>Merge Summary</h3><div class="card">
    <div>Imported: ${imported}</div><div>New: ${newC}</div><div>Updated: ${updated}</div>
    <div>Skipped: ${skipped}</div><div>Conflicts: ${conflicts}</div>
    <button class="btn" style="margin-top:12px" onclick="closeModal();render()">Done</button></div>`);
}
