<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Home Inventory</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#0f172a">
<style>
:root{
  --bg:#0f172a; --card:#16213e; --card2:#1c2b4a; --text:#e8edf7; --muted:#8b96b3;
  --accent:#14b8a6; --accent2:#22d3ee; --danger:#f87171; --warn:#fbbf24; --good:#4ade80;
  --border:#28334f; --radius:14px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans Bengali",sans-serif;}
body{display:flex;flex-direction:column;min-height:100%;}
#app{flex:1;display:flex;flex-direction:column;max-width:640px;margin:0 auto;width:100%;}
header.topbar{position:sticky;top:0;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;background:rgba(15,23,42,.92);backdrop-filter:blur(6px);z-index:20;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);}
header.topbar h1{font-size:18px;margin:0;font-weight:700;}
header.topbar .lang-btn{background:var(--card2);border:1px solid var(--border);color:var(--text);border-radius:20px;padding:6px 12px;font-size:13px;}
main{flex:1;padding:14px 14px 90px;overflow-y:auto;}
.view{display:none;}
.view.active{display:block;animation:fade .15s ease;}
@keyframes fade{from{opacity:0}to{opacity:1}}
h2.section-title{font-size:15px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:18px 0 8px;}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:12px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:12px;}
.stat-card .label{font-size:12px;color:var(--muted);margin-bottom:4px;}
.stat-card .value{font-size:20px;font-weight:700;}
.stat-card .value.good{color:var(--good)}
.stat-card .value.danger{color:var(--danger)}
.quick-actions{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
.qa-btn{background:var(--card2);border:1px solid var(--border);border-radius:12px;padding:10px 4px;text-align:center;font-size:11px;color:var(--text);}
.qa-btn .ic{font-size:20px;display:block;margin-bottom:4px;}
button{cursor:pointer;font-family:inherit;}
.btn{background:var(--accent);border:none;color:#04211d;font-weight:700;border-radius:10px;padding:11px 16px;font-size:14px;width:100%;}
.btn.secondary{background:var(--card2);color:var(--text);border:1px solid var(--border);}
.btn.danger{background:var(--danger);color:#2a0a0a;}
.btn.small{width:auto;padding:8px 12px;font-size:13px;}
.row{display:flex;gap:8px;}
.row>*{flex:1;}
label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px;}
input,select,textarea{width:100%;background:var(--card2);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:10px 12px;font-size:15px;font-family:inherit;}
input[type=checkbox]{width:auto;}
textarea{min-height:70px;resize:vertical;}
.toggle-row{display:flex;align-items:center;justify-content:space-between;margin:12px 0 4px;}
.switch{position:relative;width:42px;height:24px;flex-shrink:0;}
.switch input{opacity:0;width:0;height:0;}
.slider{position:absolute;inset:0;background:var(--card2);border:1px solid var(--border);border-radius:24px;transition:.2s;}
.slider:before{content:"";position:absolute;width:18px;height:18px;left:2px;top:2px;background:var(--muted);border-radius:50%;transition:.2s;}
input:checked+.slider{background:var(--accent);}
input:checked+.slider:before{background:#04211d;transform:translateX(18px);}
.denom-row{display:grid;grid-template-columns:60px 1fr 90px;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--border);}
.denom-row:last-child{border-bottom:none;}
.denom-label{font-weight:700;}
.denom-total{text-align:right;color:var(--accent2);font-weight:600;}
.list-item{background:var(--card2);border:1px solid var(--border);border-radius:12px;padding:10px 12px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:10px;}
.list-item .meta{font-size:12px;color:var(--muted);}
.list-item .amt{font-weight:700;white-space:nowrap;}
.list-item .amt.income{color:var(--good)}
.list-item .amt.expense{color:var(--danger)}
.badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:20px;background:var(--card2);border:1px solid var(--border);color:var(--muted);}
.badge.low{background:#3a1a1a;color:var(--danger);border-color:#5a2a2a;}
.badge.open{background:#1a3a2f;color:var(--good);border-color:#2a5a45;}
.fab{position:fixed;bottom:calc(78px + env(safe-area-inset-bottom,0px));right:20px;background:var(--accent);color:#04211d;width:54px;height:54px;border-radius:50%;border:none;font-size:26px;box-shadow:0 4px 14px rgba(0,0,0,.4);z-index:15;}
nav.bottomnav{position:sticky;bottom:0;background:rgba(22,33,62,.96);backdrop-filter:blur(6px);border-top:1px solid var(--border);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:20;}
nav.bottomnav button{flex:1;background:none;border:none;color:var(--muted);font-size:10px;padding:8px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;}
nav.bottomnav button.active{color:var(--accent);}
nav.bottomnav .ic{font-size:18px;}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:none;align-items:flex-end;justify-content:center;}
.modal-bg.active{display:flex;}
.modal{background:var(--bg);border-top-left-radius:18px;border-top-right-radius:18px;border:1px solid var(--border);width:100%;max-width:640px;max-height:88vh;overflow-y:auto;padding:16px 16px calc(24px + env(safe-area-inset-bottom,0px));}
.modal h3{margin-top:0;}
.modal-close{position:sticky;top:0;text-align:right;}
.modal-close span{cursor:pointer;color:var(--muted);font-size:22px;}
.filter-tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px;padding-bottom:2px;}
.filter-tabs button{background:var(--card2);border:1px solid var(--border);color:var(--muted);border-radius:20px;padding:6px 14px;font-size:12px;white-space:nowrap;}
.filter-tabs button.active{background:var(--accent);color:#04211d;border-color:var(--accent);font-weight:700;}
.bar-row{margin-bottom:8px;}
.bar-row .bar-label{display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px;}
.bar-track{background:var(--card2);border-radius:6px;height:10px;overflow:hidden;}
.bar-fill{background:linear-gradient(90deg,var(--accent),var(--accent2));height:100%;}
.empty{text-align:center;color:var(--muted);padding:30px 10px;font-size:13px;}
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:var(--card2);border:1px solid var(--border);color:var(--text);padding:10px 18px;border-radius:20px;font-size:13px;z-index:60;opacity:0;transition:opacity .25s;pointer-events:none;}
.toast.show{opacity:1;}
.divider{border:none;border-top:1px solid var(--border);margin:14px 0;}
.discrepancy{font-size:18px;font-weight:800;text-align:center;padding:10px;border-radius:10px;margin:10px 0;}
.discrepancy.ok{background:#1a3a2f;color:var(--good);}
.discrepancy.bad{background:#3a1a1a;color:var(--danger);}
.item-actions{display:flex;gap:5px;align-items:center;flex-wrap:wrap;justify-content:flex-end;}
.item-actions button{border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:8px;padding:5px 8px;font-size:11px;}
.item-actions .delete{color:var(--danger);}
.chip{display:inline-flex;align-items:center;gap:5px;padding:4px 8px;border:1px solid var(--border);border-radius:16px;background:var(--card2);font-size:11px;margin:2px;}
.readonly-field{opacity:.75;}
.export-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
@media(max-width:420px){.export-grid{grid-template-columns:1fr;}}
::-webkit-scrollbar{width:0;height:0;}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--bg:#0f172a;--text:#e8edf7;}}
</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <h1 id="appTitle">🏠 Home Inventory</h1>
    <button class="lang-btn" id="langToggle">EN / বাং</button>
  </header>
  <main id="main"></main>
  <button class="fab" id="fabAdd" title="Quick add">+</button>
  <nav class="bottomnav">
    <button data-view="dashboard" class="active"><span class="ic">🏠</span><span data-i18n="nav.dashboard">Dashboard</span></button>
    <button data-view="cash"><span class="ic">💵</span><span data-i18n="nav.cash">Cash</span></button>
    <button data-view="shopping"><span class="ic">🛒</span><span data-i18n="nav.shopping">Shopping</span></button>
    <button data-view="expenses"><span class="ic">🧾</span><span data-i18n="nav.expenses">Expenses</span></button>
    <button data-view="inventory"><span class="ic">📦</span><span data-i18n="nav.inventory">Inventory</span></button>
    <button data-view="reports"><span class="ic">📊</span><span data-i18n="nav.reports">Reports</span></button>
    <button data-view="transactions"><span class="ic">📋</span><span data-i18n="nav.txns">History</span></button>
    <button data-view="settings"><span class="ic">⚙️</span><span data-i18n="nav.settings">Settings</span></button>
  </nav>
</div>
<div class="modal-bg" id="modalBg"><div class="modal" id="modalBody"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ================= CONFIG / I18N ================= */
const CURRENCY_SYMBOL = "৳";
const fmt = (n) => CURRENCY_SYMBOL + Math.round(n||0).toLocaleString('en-IN');
const uid = () => 'id_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2,9);
const now = () => new Date().toISOString();
const todayStr = () => new Date().toISOString().slice(0,10);
const timeStr = () => new Date().toTimeString().slice(0,5);
let DEVICE_ID = localStorage.getItem('hi_device_id');
if(!DEVICE_ID){ DEVICE_ID = uid(); localStorage.setItem('hi_device_id', DEVICE_ID); }

const T = {
  en:{ "nav.dashboard":"Dashboard","nav.cash":"Cash","nav.shopping":"Shopping","nav.expenses":"Expenses",
    "nav.inventory":"Inventory","nav.reports":"Reports","nav.txns":"History","nav.settings":"Settings",
    balance:"Cash Balance", notesTotal:"Notes Total", coinsTotal:"Coins Total", todayExpense:"Today's Expense",
    openSessions:"Open Sessions", todayShopping:"Today's Shopping", todayTransport:"Today's Transport",
    recent:"Recent Transactions", addCash:"Add Cash", startShopping:"Start Shopping", addExpense:"Add Expense",
    addJourney:"Add Journey", addIncome:"Add Income", viewReports:"Reports", exportData:"Export", importData:"Import" },
  bn:{ "nav.dashboard":"ড্যাশবোর্ড","nav.cash":"নগদ","nav.shopping":"কেনাকাটা","nav.expenses":"খরচ",
    "nav.inventory":"মজুদ","nav.reports":"রিপোর্ট","nav.txns":"লেনদেন","nav.settings":"সেটিংস",
    balance:"নগদ ব্যালেন্স", notesTotal:"নোট মোট", coinsTotal:"কয়েন মোট", todayExpense:"আজকের খরচ",
    openSessions:"চলমান সেশন", todayShopping:"আজকের কেনাকাটা", todayTransport:"আজকের যাতায়াত",
    recent:"সাম্প্রতিক লেনদেন", addCash:"নগদ যোগ করুন", startShopping:"কেনাকাটা শুরু", addExpense:"খরচ যোগ",
    addJourney:"যাতায়াত যোগ", addIncome:"আয় যোগ", viewReports:"রিপোর্ট", exportData:"এক্সপোর্ট", importData:"ইমপোর্ট" }
};
let LANG = localStorage.getItem('hi_lang') || 'en';
function tr(key){ return (T[LANG] && T[LANG][key]) || (T.en[key]) || key; }
function applyI18n(){
  document.querySelectorAll('[data-i18n]').forEach(el=>{ el.textContent = tr(el.dataset.i18n); });
}
document.getElementById('langToggle').onclick = ()=>{ LANG = LANG==='en'?'bn':'en'; localStorage.setItem('hi_lang',LANG); applyI18n(); render(); };

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(()=>t.classList.remove('show'), 2200);
}

/* ================= DENOMINATIONS ================= */
const NOTES = [1000,500,200,100,50,20,10,5,2];
const COINS = [5,2,1];
const DEFAULT_CATEGORIES = ["Grocery","Food","Transport","Medicine","Household","Utility","Shopping","Personal","Entertainment","Other"];

/* ================= INDEXEDDB LAYER ================= */
const DB_NAME = 'homeInventoryDB', DB_VERSION = 1;
const STORES = ["categories","cashSnapshots","currentCash","sessions","expenses","incomes","inventory","transactions","settings"];
let db;
function openDB(){
  return new Promise((resolve,reject)=>{
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = (e)=>{
      const d = e.target.result;
      STORES.forEach(s=>{ if(!d.objectStoreNames.contains(s)) d.createObjectStore(s,{keyPath:'id'}); });
    };
    req.onsuccess = (e)=>{ db = e.target.result; resolve(db); };
    req.onerror = (e)=>reject(e);
  });
}
function tx(store, mode='readonly'){ return db.transaction(store, mode).objectStore(store); }
function dbGetAll(store){ return new Promise((res,rej)=>{ const r = tx(store).getAll(); r.onsuccess=()=>res(r.result); r.onerror=rej; }); }
function dbGet(store,id){ return new Promise((res,rej)=>{ const r = tx(store).get(id); r.onsuccess=()=>res(r.result); r.onerror=rej; }); }
function dbPut(store,obj){ return new Promise((res,rej)=>{ if(!obj.id) obj.id=uid(); obj.updatedAt=now(); if(!obj.createdAt) obj.createdAt=now(); obj.deviceId=DEVICE_ID; const r = tx(store,'readwrite').put(obj); r.onsuccess=()=>res(obj); r.onerror=rej; }); }
function dbDelete(store,id){ return new Promise((res,rej)=>{ const r = tx(store,'readwrite').delete(id); r.onsuccess=()=>res(); r.onerror=rej; }); }
function dbClear(store){ return new Promise((res,rej)=>{ const r = tx(store,'readwrite').clear(); r.onsuccess=()=>res(); r.onerror=rej; }); }

async function addTransaction(type, amount, category, description, sessionId=null){
  await dbPut('transactions',{ id:uid(), type, amount:Math.round(amount), category:category||'Other',
    date: todayStr(), time: timeStr(), sessionId, description: description||'', createdAt:now(), updatedAt:now() });
}

/* ================= STATE / INIT ================= */
let STATE = { view:'dashboard', advCash:false, advShopping:false, categories:[], currentCash:null };

async function seedIfEmpty(){
  const cats = await dbGetAll('categories');
  if(cats.length===0){
    for(const c of DEFAULT_CATEGORIES) await dbPut('categories',{id:uid(),name:c,active:true});
  }
  const cc = await dbGet('currentCash','current');
  if(!cc){
    const denoms = {}; [...NOTES,...COINS].forEach(d=>denoms[d]=0);
    await dbPut('currentCash',{id:'current', denoms, advanced:false, notesMeta:{}});
  }
  const s = await dbGet('settings','app');
  if(!s) await dbPut('settings',{id:'app', lang:'en', lastBackup:null});
}

async function getCurrentCash(){ return await dbGet('currentCash','current'); }
function cashTotals(cc){
  let notesTotal=0, coinsTotal=0;
  NOTES.forEach(d=>{ notesTotal += d * (cc.denoms[d]||0); });
  COINS.forEach(d=>{ coinsTotal += d * (cc.denoms[d]||0); });
  return { notesTotal, coinsTotal, grand: notesTotal+coinsTotal };
}

/* ================= ROUTER ================= */
const views = {};
function setView(v){
  STATE.view = v;
  document.querySelectorAll('nav.bottomnav button').forEach(b=>b.classList.toggle('active', b.dataset.view===v));
  render();
}
document.querySelectorAll('nav.bottomnav button').forEach(b=> b.onclick=()=>setView(b.dataset.view));
document.getElementById('fabAdd').onclick = ()=>openQuickAddMenu();

function openModal(html){
  document.getElementById('modalBody').innerHTML = '<div class="modal-close"><span onclick="closeModal()">✕</span></div>' + html;
  document.getElementById('modalBg').classList.add('active');
  applyI18n();
}
function closeModal(){ document.getElementById('modalBg').classList.remove('active'); }
document.getElementById('modalBg').onclick = (e)=>{ if(e.target.id==='modalBg') closeModal(); };

function openQuickAddMenu(){
  openModal(`<h3>Quick Add</h3>
  <button class="btn secondary" style="margin-bottom:8px" onclick="closeModal();setView('cash')">💵 ${tr('addCash')}</button>
  <button class="btn secondary" style="margin-bottom:8px" onclick="closeModal();openStartSession()">🛒 ${tr('startShopping')}</button>
  <button class="btn secondary" style="margin-bottom:8px" onclick="closeModal();openExpenseForm()">🧾 ${tr('addExpense')}</button>
  <button class="btn secondary" style="margin-bottom:8px" onclick="closeModal();openIncomeForm()">➕ ${tr('addIncome')}</button>`);
}

async function render(){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  const main = document.getElementById('main');
  main.innerHTML = '<div class="view active" id="viewRoot"></div>';
  const root = document.getElementById('viewRoot');
  if(STATE.view==='dashboard') await renderDashboard(root);
  else if(STATE.view==='cash') await renderCash(root);
  else if(STATE.view==='shopping') await renderShopping(root);
  else if(STATE.view==='expenses') await renderExpenses(root);
  else if(STATE.view==='inventory') await renderInventory(root);
  else if(STATE.view==='reports') await renderReports(root);
  else if(STATE.view==='transactions') await renderTransactions(root);
  else if(STATE.view==='settings') await renderSettings(root);
  applyI18n();
}

/* ================= DASHBOARD ================= */
async function renderDashboard(root){
  const cc = await getCurrentCash();
  const {notesTotal, coinsTotal, grand} = cashTotals(cc);
  const txns = await dbGetAll('transactions');
  const today = todayStr();
  const todayTxns = txns.filter(t=>t.date===today);
  const todayExpense = todayTxns.filter(t=>['Expense','Shopping','Transport'].includes(t.type)).reduce((a,b)=>a+b.amount,0);
  const todayShopping = todayTxns.filter(t=>t.type==='Shopping').reduce((a,b)=>a+b.amount,0);
  const todayTransport = todayTxns.filter(t=>t.type==='Transport').reduce((a,b)=>a+b.amount,0);
  const sessions = await dbGetAll('sessions');
  const openSessions = sessions.filter(s=>s.status==='open').length;
  const recent = txns.sort((a,b)=> (b.date+b.time).localeCompare(a.date+a.time)).slice(0,6);

  root.innerHTML = `
  <div class="grid2">
    <div class="stat-card"><div class="label">${tr('balance')}</div><div class="value good">${fmt(grand)}</div></div>
    <div class="stat-card"><div class="label">${tr('todayExpense')}</div><div class="value danger">${fmt(todayExpense)}</div></div>
    <div class="stat-card"><div class="label">${tr('notesTotal')}</div><div class="value">${fmt(notesTotal)}</div></div>
    <div class="stat-card"><div class="label">${tr('coinsTotal')}</div><div class="value">${fmt(coinsTotal)}</div></div>
    <div class="stat-card"><div class="label">${tr('openSessions')}</div><div class="value">${openSessions}</div></div>
    <div class="stat-card"><div class="label">${tr('todayShopping')}</div><div class="value">${fmt(todayShopping)}</div></div>
    <div class="stat-card"><div class="label">${tr('todayTransport')}</div><div class="value">${fmt(todayTransport)}</div></div>
    <div class="stat-card"><div class="label">Categories</div><div class="value">${(await dbGetAll('categories')).filter(c=>c.active).length}</div></div>
  </div>
  <h2 class="section-title">Quick Actions</h2>
  <div class="quick-actions">
    <button class="qa-btn" onclick="setView('cash')"><span class="ic">💵</span>${tr('addCash')}</button>
    <button class="qa-btn" onclick="openStartSession()"><span class="ic">🛒</span>${tr('startShopping')}</button>
    <button class="qa-btn" onclick="openExpenseForm()"><span class="ic">🧾</span>${tr('addExpense')}</button>
    <button class="qa-btn" onclick="openIncomeForm()"><span class="ic">➕</span>${tr('addIncome')}</button>
    <button class="qa-btn" onclick="setView('reports')"><span class="ic">📊</span>${tr('viewReports')}</button>
    <button class="qa-btn" onclick="setView('settings')"><span class="ic">⬇️</span>${tr('exportData')}</button>
  </div>
  <h2 class="section-title">${tr('recent')}</h2>
  ${recent.length? recent.map(txnRow).join('') : `<div class="empty">No transactions yet. Try Load Demo Data in Settings.</div>`}
  `;
}
function txnRow(t){
  const isIncome = t.type==='Income';
  return `<div class="list-item"><div><div>${t.description||t.type}</div><div class="meta">${t.type} · ${t.category} · ${t.date} ${t.time}</div></div><div class="amt ${isIncome?'income':'expense'}">${isIncome?'+':'-'}${fmt(t.amount)}</div></div>`;
}

/* ================= CASH / DENOMINATIONS ================= */
async function renderCash(root){
  const cc = await getCurrentCash();
  const {notesTotal, coinsTotal, grand} = cashTotals(cc);
  const snapshots = (await dbGetAll('cashSnapshots')).sort((a,b)=>b.createdAt.localeCompare(a.createdAt));
  root.innerHTML = `
  <div class="grid3">
    <div class="stat-card"><div class="label">Notes</div><div class="value">${fmt(notesTotal)}</div></div>
    <div class="stat-card"><div class="label">Coins</div><div class="value">${fmt(coinsTotal)}</div></div>
    <div class="stat-card"><div class="label">Grand Total</div><div class="value good">${fmt(grand)}</div></div>
  </div>
  <div class="card">

}
function renderDenomRows(cc){
  const notesEl = document.getElementById('notesRows');
  const coinsEl = document.getElementById('coinsRows');
  notesEl.innerHTML = NOTES.map(d=>denomRowHtml(d,cc,true)).join('');
  coinsEl.innerHTML = COINS.map(d=>denomRowHtml(d,cc,false)).join('');
  [...NOTES,...COINS].forEach(d=>{
    const inp = document.getElementById('qty_'+d);
    inp.oninput = async ()=>{
      const cc2 = await getCurrentCash();
      cc2.denoms[d] = Math.max(0, parseInt(inp.value)||0);
      await dbPut('currentCash',cc2);
      document.getElementById('tot_'+d).textContent = fmt(d*cc2.denoms[d]);
      const t = cashTotals(cc2);
      // silently refresh header stat cards if present
    };
  });
}
function denomRowHtml(d,cc,isNote){
  const qty = cc.denoms[d]||0;
  let advHtml = '';
  if(isNote && cc.advanced){
    const meta = cc.notesMeta[d] || {condition:'General', torn:false};
    advHtml = `<div class="row" style="margin-top:6px">
      <select onchange="setNoteMeta(${d},'condition',this.value)">
        ${['New','Medium Old','Old','General'].map(c=>`<option value="${c}" ${meta.condition===c?'selected':''}>${c}</option>`).join('')}
      </select>
      <label style="display:flex;align-items:center;gap:6px;margin:0;"><input type="checkbox" ${meta.torn?'checked':''} onchange="setNoteMeta(${d},'torn',this.checked)"> Torn</label>
    </div>`;
  }
  return `<div class="denom-row"><div class="denom-label">${CURRENCY_SYMBOL}${d}</div>
    <input type="number" min="0" id="qty_${d}" value="${qty}">
    <div class="denom-total" id="tot_${d}">${fmt(d*qty)}</div></div>${advHtml}`;
}
async function setNoteMeta(d,key,val){
  const cc = await getCurrentCash();
  if(!cc.notesMeta[d]) cc.notesMeta[d]={condition:'General',torn:false};
  cc.notesMeta[d][key]=val;
  await dbPut('currentCash',cc);
}
async function saveSnapshotFlow(){
  const cc = await getCurrentCash();
  const {notesTotal,coinsTotal,grand} = cashTotals(cc);
  openModal(`<h3>Save Cash Snapshot</h3>
    <label>Snapshot Name</label><input id="snapName" placeholder="e.g. Morning Cash — ${todayStr()}">

async function confirmSnapshot(){

  await dbPut('cashSnapshots',{id:uid(), name, denoms:{...cc.denoms}, notesTotal, coinsTotal, grand, createdAt:now()});
  await addTransaction('Cash Snapshot', 0, 'Cash', name);

/* ================= SHOPPING SESSIONS ================= */
function sessionItemsTotal(s){ return (s.items||[]).reduce((a,i)=>a+i.total,0); }
function sessionJourneysTotal(s){ return (s.journeys||[]).reduce((a,j)=>a+j.cost,0); }
function sessionTotal(s){ return sessionItemsTotal(s) + sessionJourneysTotal(s); }

async function renderShopping(root){
  const sessions = (await dbGetAll('sessions')).sort((a,b)=>b.createdAt.localeCompare(a.createdAt));
  root.innerHTML = `<button class="btn" onclick="openStartSession()">🛒 ${tr('startShopping')}</button>
  <h2 class="section-title">Sessions</h2>
  ${sessions.length? sessions.map(s=>{
    const total = sessionTotal(s);
    return `<div class="list-item" onclick="openSessionDetail('${s.id}')" style="cursor:pointer">
      <div><div>${s.name} <span class="badge ${s.status==='open'?'open':''}">${s.status}</span></div>
      <div class="meta">${s.date} · cash taken ${fmt(s.cashTaken)} · ${(s.items||[]).length} items</div>
      ${s.status==='closed'?`<div class="meta">Actual return: <b style="color:var(--good)">${fmt(s.endCash||0)}</b></div>`:''}</div>
      <div class="amt expense">${fmt(total)}</div></div>`;
  }).join('') : '<div class="empty">No shopping sessions yet.</div>'}`;
}

function openStartSession(){
  openModal(`<h3>${tr('startShopping')}</h3>

async function createSession(){

    startTime:document.getElementById('sesTime').value||timeStr(), cashTaken, status:'open',
    items:[], journeys:[], advanced:false, shop:{name:'',phone:'',address:''},
    bill:{total:0,paid:0,change:0}, endCash:null, createdAt:now() };

  document.getElementById('advSesToggle').onchange=async e=>{const x=await dbGet('sessions',id);x.advanced=e.target.checked;await dbPut('sessions',x);openSessionDetail(id)};

function renderNewJourneyAdvanced(on){

function escapeHtml(v){return String(v??'').replace(/[&<>'"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]));}
function itemQtyLabel(it){const q=it.quantity!=null&&it.quantity!==''?it.quantity:(it.qty!=null&&it.qty!==''?it.qty:'');return q!==''?` × ${q}`:'';}
async function getJourneyTypes(){const st=await dbGet('settings','app');return Array.isArray(st?.journeyTypes)&&st.journeyTypes.length?st.journeyTypes:['Rickshaw','CNG','Bus','Walking','Other'];}
async function addJourneyTypeFromSession(id){const name=prompt('Add vehicle / journey type (e.g. Van, Auto)');if(!name||!name.trim())return;const st=await dbGet('settings','app')||{id:'app'};st.journeyTypes=Array.isArray(st.journeyTypes)?st.journeyTypes:await getJourneyTypes();const clean=name.trim();if(!st.journeyTypes.some(x=>x.toLowerCase()===clean.toLowerCase()))st.journeyTypes.push(clean);await dbPut('settings',st);await openSessionDetail(id);const sel=document.getElementById('journeyType');if(sel)sel.value=clean;}
function renderAdvShopBlock(s){const el=document.getElementById('advShopBlock');if(!s.advanced){el.innerHTML='';return;}el.innerHTML=`<label>Shop Name</label><input id="shopName" value="${escapeHtml(s.shop.name||'')}"><label>Shop Phone</label><input id="shopPhone" value="${escapeHtml(s.shop.phone||'')}"><label>Shop Address</label><input id="shopAddr" value="${escapeHtml(s.shop.address||'')}"><div class="row"><div><label>Bill Total</label><input type="number" id="billTotal" value="${s.bill.total||0}"></div><div><label>Paid</label><input type="number" id="billPaid" value="${s.bill.paid||0}"></div></div><button class="btn secondary" style="margin-top:8px" onclick="saveShopBill('${s.id}')">Save Shop / Bill Info</button>`;}
async function saveShopBill(id){const s=await dbGet('sessions',id);s.shop={name:document.getElementById('shopName').value,phone:document.getElementById('shopPhone').value,address:document.getElementById('shopAddr').value};const total=parseInt(document.getElementById('billTotal').value)||0,paid=parseInt(document.getElementById('billPaid').value)||0;s.bill={total,paid,change:Math.max(0,paid-total)};await dbPut('sessions',s);toast('Saved');openSessionDetail(id);}
function parseMaybeNumber(v){if(v==null||v==='')return '';const n=parseFloat(v);return Number.isNaN(n)?'':n;}
function parseQuickItems(text){return text.split(/\n|;/).map(l=>l.trim()).filter(Boolean).map(line=>{const f=line.split(',').map(x=>x.trim());if(f.length>=2){const price=parseFloat((f[1]||'').replace(/[^0-9.\-]/g,''));if(!Number.isNaN(price))return{name:f[0],price,total:price,unit:f[2]||'',unitPrice:parseMaybeNumber(f[3]),quantity:parseMaybeNumber(f[4]),pieces:parseMaybeNumber(f[5]),note:f.slice(6).join(', ').trim(),subcategory:''};}let m=line.match(/^(.+?)\s+(?:৳|tk|taka)?\s*([\d.]+)\s*(?:tk|taka|৳)?$/i);if(!m)m=line.match(/^(.+?)[,\-–]\s*(?:৳|tk|taka)?\s*([\d.]+)\s*(?:tk|taka|৳)?$/i);if(!m)return null;const price=parseFloat(m[2]);return{name:m[1].trim(),price,total:price,unit:'',unitPrice:price,quantity:'',pieces:'',note:''};}).filter(Boolean);}
async function quickAddItems(id){const parsed=parseQuickItems(document.getElementById('quickItems').value);if(!parsed.length){toast('No valid items found — use "Item, Price" or "Rice 10 taka"');return;}const s=await dbGet('sessions',id);s.items=s.items||[];parsed.forEach(p=>{const qty=p.quantity!==''&&p.quantity!=null?p.quantity:1;const total=(p.unitPrice!==''&&p.unitPrice!=null&&p.quantity!==''&&p.quantity!=null)?Math.round(p.unitPrice*p.quantity):Math.round(p.total);s.items.push({id:uid(),name:p.name,category:'',brand:'',unit:p.unit||'',qty,quantity:p.quantity,pieces:p.pieces,priceUnit:p.unitPrice!==''&&p.unitPrice!=null?p.unitPrice:p.price,unitPrice:p.unitPrice,total,note:p.note||'',advanced:Boolean(p.unit||p.unitPrice!==''||p.quantity!==''||p.pieces!==''||p.note),addToInventory:false});});await dbPut('sessions',s);toast(parsed.length+' item(s) added');openSessionDetail(id);}
function startVoiceItem(id){

  r.onerror=()=>toast('Voice input could not be captured');r.start();

async function editSessionItem(id,idx){const s=await dbGet('sessions',id),it=s.items[idx];if(!it)return;openModal(`<h3>Edit Item</h3><label>Item Name *</label><input id="eiName" value="${escapeHtml(it.name)}"><label>Item Price / Total *</label><input type="number" min="0" id="eiPrice" value="${it.total||0}"><div class="toggle-row"><b>Advanced item details</b><label class="switch"><input type="checkbox" id="eiAdv" ${it.advanced?'checked':''}><span class="slider"></span></label></div><div id="eiAdvBlock"></div><label style="display:flex;align-items:center;gap:8px;margin-top:10px"><input type="checkbox" id="eiInv" ${it.addToInventory?'checked':''}> Add to inventory when session closes</label><button class="btn" style="margin-top:12px" onclick="saveSessionItem('${id}',${idx})">Save Item</button>`);const render=()=>{const on=document.getElementById('eiAdv').checked;const b=document.getElementById('eiAdvBlock');b.style.display=on?'block':'none';if(on)b.innerHTML=`<div class="row"><div><label>Unit</label><input id="eiUnit" value="${escapeHtml(it.unit||'')}"></div><div><label>Unit Price</label><input type="number" min="0" id="eiUnitPrice" value="${it.unitPrice??it.priceUnit??''}"></div></div><div class="row"><div><label>Quantity</label><input type="number" min="0" step="any" id="eiQty" value="${it.quantity??it.qty??''}"></div><div><label>Pieces</label><input type="number" min="0" step="any" id="eiPieces" value="${it.pieces??''}"></div></div><label>Subcategory (optional)</label><input id="eiSubcategory" value="${escapeHtml(it.subcategory||'')}"><label>Note</label><textarea id="eiNote">${escapeHtml(it.note||'')}</textarea>`;};document.getElementById('eiAdv').onchange=render;render();}
async function saveSessionItem(id,idx){const s=await dbGet('sessions',id),it=s.items[idx],name=document.getElementById('eiName').value.trim(),total=parseFloat(document.getElementById('eiPrice').value);if(!name||Number.isNaN(total)||total<0){toast('Item name and price are required');return;}it.name=name;it.total=Math.round(total);it.addToInventory=document.getElementById('eiInv').checked;it.advanced=document.getElementById('eiAdv').checked;if(it.advanced){it.unit=document.getElementById('eiUnit')?.value.trim()||'';it.unitPrice=parseMaybeNumber(document.getElementById('eiUnitPrice')?.value);it.priceUnit=it.unitPrice!==''?it.unitPrice:it.priceUnit;it.quantity=parseMaybeNumber(document.getElementById('eiQty')?.value);it.qty=it.quantity!==''?it.quantity:1;it.pieces=parseMaybeNumber(document.getElementById('eiPieces')?.value);it.note=document.getElementById('eiNote')?.value||'';it.subcategory=document.getElementById('eiSubcategory')?.value.trim()||'';}await dbPut('sessions',s);closeModal();openSessionDetail(id);}

async function editJourney(id,idx){const s=await dbGet('sessions',id),j=s.journeys[idx];if(!j)return;const types=await getJourneyTypes();openModal(`<h3>Edit Journey</h3><label>Vehicle / Type</label><select id="ejType">${types.map(t=>`<option ${t===j.type?'selected':''}>${escapeHtml(t)}</option>`).join('')}</select><label>Cost</label><input type="number" min="0" id="ejCost" value="${j.cost||0}"><div class="toggle-row"><b>Advanced journey details</b><label class="switch"><input type="checkbox" id="ejAdv" ${j.advanced?'checked':''}><span class="slider"></span></label></div><div id="ejAdvBlock"></div><button class="btn" style="margin-top:12px" onclick="saveJourney('${id}',${idx})">Save Journey</button>`);const render=()=>{const on=document.getElementById('ejAdv').checked;document.getElementById('ejAdvBlock').innerHTML=on?`<div class="row"><div><label>Journey Started Time</label><input type="datetime-local" id="ejStart" value="${toLocalDateTimeValue(j.startedAt)}"></div><div><label>Journey Ended Time</label><input type="datetime-local" id="ejEnd" value="${toLocalDateTimeValue(j.endedAt)}"></div></div><div class="row"><div><label>Journey Started From</label><input id="ejFrom" value="${escapeHtml(j.from||'')}"></div><div><label>Journey Ended At</label><input id="ejTo" value="${escapeHtml(j.to||'')}"></div></div>`:'';};document.getElementById('ejAdv').onchange=render;render();}

async function saveJourney(id,idx){const s=await dbGet('sessions',id),j=s.journeys[idx];j.type=document.getElementById('ejType').value;j.cost=Math.max(0,parseInt(document.getElementById('ejCost').value)||0);j.advanced=document.getElementById('ejAdv').checked;if(j.advanced){j.startedAt=document.getElementById('ejStart').value?new Date(document.getElementById('ejStart').value).toISOString():'';j.endedAt=document.getElementById('ejEnd').value?new Date(document.getElementById('ejEnd').value).toISOString():'';j.from=document.getElementById('ejFrom').value.trim();j.to=document.getElementById('ejTo').value.trim();}await dbPut('sessions',s);closeModal();openSessionDetail(id);}

async function confirmEndSession(id,expected){const actual=parseInt(document.getElementById('actualCash').value);if(isNaN(actual)||actual<0){toast('Enter a valid actual return');return;}const s=await dbGet('sessions',id),total=sessionTotal(s);s.status='closed';s.endCash=actual;s.actualReturn=actual;s.expectedCash=expected;s.expectedReturn=expected;s.difference=actual-expected;s.endTime=now();await dbPut('sessions',s);const itemsTotal=sessionItemsTotal(s),journeysTotal=sessionJourneysTotal(s);if(itemsTotal>0)await addTransaction('Shopping',itemsTotal,'Shopping',s.name,s.id);if(journeysTotal>0)await addTransaction('Transport',journeysTotal,'Transport',s.name+' (transport)',s.id);for(const it of(s.items||[]))if(it.addToInventory){const inv=(await dbGetAll('inventory')).find(i=>i.name.toLowerCase()===it.name.toLowerCase()),qty=(it.quantity!=null&&it.quantity!=='')?it.quantity:(it.qty||1);if(inv){inv.currentQty=(inv.currentQty||0)+qty;inv.lastPurchasePrice=it.unitPrice??it.priceUnit;inv.lastPurchaseDate=todayStr();await dbPut('inventory',inv);}else await dbPut('inventory',{id:uid(),name:it.name,category:it.category||'Other',unit:it.unit||'',currentQty:qty,minQty:1,brand:it.brand||'',lastPurchasePrice:it.unitPrice??it.priceUnit,lastPurchaseDate:todayStr(),notes:it.note||''});}closeModal();toast('Session reconciled');render();}

  const dIncome = sum(todayT,['Income']), dExpense = sum(todayT,['Expense','Shopping','Transport']);

function downloadFile(filename, content, mime){
  const blob = new Blob([content],{type:mime});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename; a.click();
  URL.revokeObjectURL(a.href);
}

function csvEscape(v){ if(v==null) return ''; const s=String(v).replace(/"/g,'""'); return /[",\n]/.test(s)?`"${s}"`:s; }
function categoryMatches(record,selected,cats=[]){if(selected==='All')return true;const wanted=String(selected).toLowerCase();const direct=String(record.category||'').toLowerCase()===wanted||String(record.subcategory||'').toLowerCase()===wanted;if(direct)return true;const children=new Set();let changed=true;while(changed){changed=false;for(const c of cats){if(String(c.parentId||'') && (String(c.parentId).toLowerCase()===wanted||[...children].some(id=>String(id).toLowerCase()===String(c.parentId).toLowerCase()))){if(!children.has(c.name)){children.add(c.name);changed=true;}}}}return children.has(record.category)||children.has(record.subcategory);}
function periodMatch(date,period){const d=new Date(date+'T00:00:00'),n=new Date();if(period==='all')return true;if(period==='day')return date===todayStr();if(period==='month')return date.startsWith(todayStr().slice(0,7));if(period==='week'){n.setHours(0,0,0,0);const day=(n.getDay()+6)%7,st=new Date(n);st.setDate(n.getDate()-day);return d>=st&&d<=n;}return true;}
async function collectReportRows(dataset='transactions',period='all',category='All'){const rows=[],cats=await dbGetAll('categories');if(dataset==='transactions'||dataset==='expenses'){const a=dataset==='transactions'?await dbGetAll('transactions'):await dbGetAll('expenses');a.filter(r=>periodMatch(r.date||'',period)&&categoryMatches(r,category,cats)).forEach(r=>rows.push({...r,recordType:dataset}));}else if(['sessions','items','journeys'].includes(dataset)){for(const s of await dbGetAll('sessions')){if(!periodMatch(s.date||'',period))continue;if(dataset==='sessions')rows.push({...s,recordType:'session',total:sessionTotal(s),actualReturn:s.actualReturn??s.endCash??''});if(dataset==='items')(s.items||[]).filter(i=>categoryMatches(i,category,cats)).forEach(i=>rows.push({...i,sessionId:s.id,sessionName:s.name,date:s.date,recordType:'item'}));if(dataset==='journeys')(s.journeys||[]).forEach(j=>rows.push({...j,sessionId:s.id,sessionName:s.name,date:s.date,recordType:'journey'}));}}else for(const st of STORES)for(const r of await dbGetAll(st))rows.push({...r,recordType:st});return rows;}
function rowsToCSV(rows){if(!rows.length)return '';const keys=[...new Set(rows.flatMap(r=>Object.keys(r)))];return [keys.map(csvEscape).join(',')].concat(rows.map(r=>keys.map(k=>csvEscape(typeof r[k]==='object'?JSON.stringify(r[k]):r[k])).join(','))).join('\n');}
function rowsToExcelHtml(rows,title){const keys=[...new Set(rows.flatMap(r=>Object.keys(r)))],th=keys.map(k=>`<th>${escapeHtml(k)}</th>`).join(''),tr=rows.map(r=>`<tr>${keys.map(k=>`<td>${escapeHtml(typeof r[k]==='object'?JSON.stringify(r[k]):r[k]??'')}</td>`).join('')}</tr>`).join('');return `<html><head><meta charset="UTF-8"></head><body><h2>${escapeHtml(title)}</h2><table border="1"><thead><tr>${th}</tr></thead><tbody>${tr}</tbody></table></body></html>`;}
async function openExportOptions(){const cats=(await dbGetAll('categories')).filter(c=>c.active);openModal(`<h3>Export / Report Builder</h3><label>Dataset</label><select id="repDataset"><option value="transactions">Transactions</option><option value="expenses">Expenses</option><option value="sessions">Shopping Sessions</option><option value="items">Shopping Items</option><option value="journeys">Journeys</option><option value="all">Full List</option></select><label>Period</label><select id="repPeriod"><option value="all">All</option><option value="day">Today / Day</option><option value="week">Current Week</option><option value="month">Current Month</option></select><label>Category</label><select id="repCategory"><option>All</option>${cats.map(c=>`<option value="${escapeHtml(c.name)}">${c.parentId?'↳ ':''}${escapeHtml(c.name)}</option>`).join('')}</select><div class="export-grid" style="margin-top:12px"><button class="btn secondary" onclick="runReportExport('json')">JSON</button><button class="btn secondary" onclick="runReportExport('csv')">CSV</button><button class="btn secondary" onclick="runReportExport('xls')">Excel (.xls)</button></div>`);}
async function runReportExport(format){const dataset=document.getElementById('repDataset').value,period=document.getElementById('repPeriod').value,category=document.getElementById('repCategory').value,rows=await collectReportRows(dataset,period,category),stamp=todayStr();if(format==='json')downloadFile(`home-inventory-${dataset}-${period}-${stamp}.json`,JSON.stringify({schemaVersion:1,exportedAt:now(),dataset,period,category,rows},null,2),'application/json');else if(format==='csv')downloadFile(`home-inventory-${dataset}-${period}-${stamp}.csv`,rowsToCSV(rows),'text/csv;charset=utf-8');else downloadFile(`home-inventory-${dataset}-${period}-${stamp}.xls`,rowsToExcelHtml(rows,`Home Inventory - ${dataset}`),'application/vnd.ms-excel');closeModal();toast('Report exported');}
async function exportCSV(){const rows=await collectReportRows('transactions','all','All');downloadFile(`home-inventory-transactions-${todayStr()}.csv`,rowsToCSV(rows),'text/csv;charset=utf-8');toast('Exported CSV');}
async function backupNow(){
  await exportJSON();
  const s = await dbGet('settings','app'); s.lastBackup = now(); await dbPut('settings',s); render();
}
async function resetAllData(){
  if(!confirm('This will permanently delete ALL data on this device. Continue?')) return;
  if(!confirm('Are you absolutely sure? This cannot be undone.')) return;
  for(const s of STORES) await dbClear(s);
  await seedIfEmpty(); toast('All data reset'); render();
}

/* ---- Import / Merge ---- */
function validateImportShape(data){
  if(typeof data!=='object'||!data) return false;
  if(!('schemaVersion' in data)) return false;
  return STORES.some(s=>Array.isArray(data[s]));
}
function parseCSVLine(line){const out=[];let cur='',quoted=false;for(let i=0;i<line.length;i++){const ch=line[i];if(ch==='"'){if(quoted&&line[i+1]==='"'){cur+='"';i++;}else quoted=!quoted;}else if(ch===','&&!quoted){out.push(cur);cur='';}else cur+=ch;}out.push(cur);return out;}
async function doImport(){
  const file = document.getElementById('importFile').files[0];
  if(!file){ toast('Choose a JSON file first'); return; }
  const replace = document.getElementById('importReplace').checked;
  const text = await file.text();
  let data;
  if(file.name.toLowerCase().endsWith('.csv')){const lines=text.split(/\r?\n/).filter(Boolean);if(lines.length<2){toast('CSV file is empty');return;}const headers=parseCSVLine(lines[0]);const records=lines.slice(1).map(line=>{const vals=parseCSVLine(line),o={};headers.forEach((h,i)=>o[h]=vals[i]??'');return o;});data={schemaVersion:1,transactions:records};}else{try{data=JSON.parse(text);}catch(e){toast('Invalid JSON file');return;}}
  if(!validateImportShape(data)){ toast('File does not look like a Home Inventory export'); return; }
  if(replace && !confirm('Replace ALL local data with this import? This cannot be undone.')) return;

  let imported=0,newC=0,updated=0,skipped=0,conflicts=0;
  for(const storeName of STORES){
    if(!Array.isArray(data[storeName])) continue;
    if(replace) await dbClear(storeName);
    for(const rec of data[storeName]){
      if(!rec || !rec.id){ skipped++; continue; }
      imported++;
      if(replace){ await dbPut(storeName, rec); newC++; continue; }
      const existing = await dbGet(storeName, rec.id);
      if(!existing){ await dbPut(storeName, rec); newC++; }
      else{
        const exTime = existing.updatedAt || existing.createdAt || '';
        const inTime = rec.updatedAt || rec.createdAt || '';
        if(inTime > exTime){ await dbPut(storeName, rec); updated++; }
        else{ skipped++; }
      }
    }
  }
  toast('Import complete'); closeModal();
  openModal(`<h3>Merge Summary</h3><div class="card">
    <div>Imported: ${imported}</div><div>New: ${newC}</div><div>Updated: ${updated}</div>
    <div>Skipped: ${skipped}</div><div>Conflicts: ${conflicts}</div>
    <button class="btn" style="margin-top:12px" onclick="closeModal();render()">Done</button></div>`);
}
